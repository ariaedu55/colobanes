; Réglages PHP appliqués quand PHP tourne en PHP-FPM / CGI (cas de Webuzo sur le VPS).
; Remplace les directives php_value qui ne fonctionnent qu'en mod_php (.htaccess).
;
; IMPORTANT : ne pas utiliser auto_prepend_file avec un chemin relatif.
; Sur les URLs /boutique/… et /user/… le CWD PHP n'est plus la racine :
; Failed opening required 'includes/session_bootstrap_prepend.php'
; La config session est déjà faite via includes/session_user.php
; + session_start_persistent() sur chaque page.
;
; Fuseau : surchargé aussi par includes/app_timezone.php (config/site.php ou OS).
; Local XAMPP Mac → Europe/Lisbon ; prod Sénégal → Africa/Dakar
date.timezone = Europe/Lisbon

; Backend principal = MySQL (table php_sessions) via session_user.php.
; save_path ci-dessous = secours fichiers HORS /var/webuzo-data/...
session.gc_maxlifetime = 2592000
session.cookie_lifetime = 2592000
session.save_path = "/home/colobanes/tmp/sessions"
session.gc_probability = 1
session.gc_divisor = 100
auto_prepend_file =
upload_max_filesize = 1000M
post_max_size = 1000M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Sécurité : ne jamais afficher les erreurs PHP aux visiteurs (elles restent dans error_log)
display_errors = Off
display_startup_errors = Off
log_errors = On
